services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: clinician
      POSTGRES_PASSWORD: clinician
      POSTGRES_DB: clinician
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinician -d clinician"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
